name: Build and test Thunderstore package

run-name: Build ${{ github.run_number }} from ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsp-guide-check-main
  cancel-in-progress: false

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest

    steps:
      - name: Pull source
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Confirm triggering commit
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -cne '${{ github.sha }}') {
            throw "Checkout mismatch: expected ${{ github.sha }}, found $checkedOut."
          }

      - name: Install .NET SDK
        id: setup_dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Prepare build version
        id: version
        shell: pwsh
        run: |
          ./scripts/Set-BuildVersion.ps1 `
            -Sequence ${{ github.run_number }} `
            -Commit '${{ github.sha }}'

      - name: Download Thunderstore BepInEx 5.4.17 compile reference
        id: bepinex
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'xiaoye97-BepInEx-5.4.17.zip'
          $referenceRoot = Join-Path $env:RUNNER_TEMP 'bepinex-reference'
          $uri = 'https://thunderstore.io/package/download/' +
            'xiaoye97/BepInEx/5.4.17/'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $referenceRoot
          $reference = Join-Path $referenceRoot `
            'BepInExPack\BepInEx\core\BepInEx.dll'
          if (-not (Test-Path -LiteralPath $reference -PathType Leaf)) {
            throw "BepInEx compile reference was not found at $reference."
          }
          $referenceVersion = (
            [Reflection.AssemblyName]::GetAssemblyName($reference)
          ).Version.ToString()
          if ($referenceVersion -cne '5.4.17.0') {
            throw "BepInEx reference version is $referenceVersion; expected 5.4.17.0."
          }
          "CI_BEPINEX_PATH=$reference" >> $env:GITHUB_ENV

      - name: Restore CI reference packages
        id: restore
        shell: pwsh
        run: |
          dotnet restore `
            src/DspProgressionStatusExporter/DspProgressionStatusExporter.csproj `
            -p:UseCiReferences=true `
            "-p:CiBepInExPath=$env:CI_BEPINEX_PATH"

      - name: Build diagnostic DLL
        id: build
        shell: pwsh
        run: |
          dotnet build `
            src/DspProgressionStatusExporter/DspProgressionStatusExporter.csproj `
            --configuration Release `
            --no-restore `
            -p:UseCiReferences=true `
            "-p:CiBepInExPath=$env:CI_BEPINEX_PATH" `
            "-p:Version=$env:SEMANTIC_VERSION" `
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:ASSEMBLY_VERSION" `
            "-p:InformationalVersion=$env:RELEASE_LABEL" `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:ContinuousIntegrationBuild=true `
            --output artifacts/build/diagnostic

      - name: Test diagnostic DLL
        id: test
        shell: pwsh
        run: |
          ./scripts/Test-BuildArtifact.ps1 `
            -DllPath 'artifacts/build/diagnostic/DspGuideCheck.dll' `
            -ExpectedReleaseLabel $env:RELEASE_LABEL `
            -ExpectedSemanticVersion $env:SEMANTIC_VERSION `
            -ExpectedAssemblyVersion $env:ASSEMBLY_VERSION `
            -ExpectedBepInExReferenceVersion '5.4.17.0' `
            -ReportPath 'artifacts/DIAGNOSTIC-TEST-REPORT.md'
          ./scripts/Test-SnapshotControlVariant.ps1 `
            -DllPath 'artifacts/build/diagnostic/DspGuideCheck.dll' `
            -ExpectedVariant diagnostic
          ./scripts/Test-ProductionRisk.ps1 `
            -DllPath 'artifacts/build/diagnostic/DspGuideCheck.dll'

      - name: Build public DLL
        id: public_build
        shell: pwsh
        run: |
          dotnet build `
            src/DspProgressionStatusExporter/DspProgressionStatusExporter.csproj `
            --configuration Release `
            --no-restore `
            -p:UseCiReferences=true `
            "-p:CiBepInExPath=$env:CI_BEPINEX_PATH" `
            "-p:Version=$env:SEMANTIC_VERSION" `
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:ASSEMBLY_VERSION" `
            "-p:InformationalVersion=$env:RELEASE_LABEL" `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:ContinuousIntegrationBuild=true `
            -p:IncludeSnapshotControl=false `
            --output artifacts/build/public

      - name: Test public DLL
        id: public_test
        shell: pwsh
        run: |
          ./scripts/Test-BuildArtifact.ps1 `
            -DllPath 'artifacts/build/public/DspGuideCheck.dll' `
            -ExpectedReleaseLabel $env:RELEASE_LABEL `
            -ExpectedSemanticVersion $env:SEMANTIC_VERSION `
            -ExpectedAssemblyVersion $env:ASSEMBLY_VERSION `
            -ExpectedBepInExReferenceVersion '5.4.17.0' `
            -ReportPath 'artifacts/PUBLIC-TEST-REPORT.md'
          ./scripts/Test-SnapshotControlVariant.ps1 `
            -DllPath 'artifacts/build/public/DspGuideCheck.dll' `
            -ExpectedVariant public

      - name: Build Thunderstore package
        id: package
        shell: pwsh
        run: |
          ./scripts/New-ThunderstorePackage.ps1 `
            -DllPath 'artifacts/build/public/DspGuideCheck.dll' `
            -VersionNumber $env:PACKAGE_VERSION `
            -ReadmePath 'packaging/README.md'

      - name: Test Thunderstore package
        id: package_test
        shell: pwsh
        run: |
          ./scripts/Test-ThunderstorePackage.ps1 `
            -PackagePath "artifacts/packages/DSPGuideCheck-$env:PACKAGE_VERSION.zip" `
            -ExpectedVersion $env:PACKAGE_VERSION `
            -ExpectedDllPath 'artifacts/build/public/DspGuideCheck.dll'

      - name: Upload installable package and reports
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: DSPGuideCheck-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/packages/DSPGuideCheck-${{ steps.version.outputs.package_version }}.zip
            artifacts/build/diagnostic/DspGuideCheck.dll
            artifacts/build/public/DspGuideCheck.dll
            artifacts/BUILD-INFO.txt
            artifacts/DIAGNOSTIC-TEST-REPORT.md
            artifacts/PUBLIC-TEST-REPORT.md
            artifacts/PACKAGE-REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Report detailed status
        if: always()
        shell: pwsh
        env:
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          SDK_STATUS: ${{ steps.setup_dotnet.outcome }}
          VERSION_STATUS: ${{ steps.version.outcome }}
          BEPINEX_STATUS: ${{ steps.bepinex.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          TEST_STATUS: ${{ steps.test.outcome }}
          PUBLIC_BUILD_STATUS: ${{ steps.public_build.outcome }}
          PUBLIC_TEST_STATUS: ${{ steps.public_test.outcome }}
          PACKAGE_STATUS: ${{ steps.package.outcome }}
          PACKAGE_TEST_STATUS: ${{ steps.package_test.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
          RELEASE_LABEL_VALUE: ${{ steps.version.outputs.release_label }}
          PACKAGE_VERSION_VALUE: ${{ steps.version.outputs.package_version }}
          SEMANTIC_VERSION_VALUE: ${{ steps.version.outputs.semantic_version }}
          ASSEMBLY_VERSION_VALUE: ${{ steps.version.outputs.assembly_version }}
        run: |
          @"
          # DSP Guide Check build status

          | Field | Value |
          | --- | --- |
          | Source commit | `${{ github.sha }}` |
          | Workflow sequence | `${{ github.run_number }}` |
          | Release label | `$env:RELEASE_LABEL_VALUE` |
          | Package/plugin version | `$env:PACKAGE_VERSION_VALUE` |
          | Semantic version | `$env:SEMANTIC_VERSION_VALUE` |
          | Assembly version | `$env:ASSEMBLY_VERSION_VALUE` |

          | Stage | Status |
          | --- | --- |
          | Pull source | $env:CHECKOUT_STATUS |
          | Install SDK | $env:SDK_STATUS |
          | Generate version | $env:VERSION_STATUS |
          | Acquire BepInEx reference | $env:BEPINEX_STATUS |
          | Restore reference packages | $env:RESTORE_STATUS |
          | Build diagnostic DLL | $env:BUILD_STATUS |
          | Test diagnostic DLL | $env:TEST_STATUS |
          | Build public DLL | $env:PUBLIC_BUILD_STATUS |
          | Test public DLL | $env:PUBLIC_TEST_STATUS |
          | Build Thunderstore package | $env:PACKAGE_STATUS |
          | Test Thunderstore package | $env:PACKAGE_TEST_STATUS |
          | Publish artifact | $env:UPLOAD_STATUS |
          "@ >> $env:GITHUB_STEP_SUMMARY
